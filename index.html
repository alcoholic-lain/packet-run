<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Mono:wght@500&family=DM+Sans:wght@400;600&display=swap"><title>SOAP vs REST</title>
<style>
:root{--bg:#EFE6D2;--ink:#1D1B16;--panel:#FBF6EA;--red:#E4572E;--gold:#F2B134;--sh:#1D1B16;box-sizing:border-box;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B1914;--ink:#F3EAD6;--panel:#27241C;--sh:#000;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1B1914;--ink:#F3EAD6;--panel:#27241C;--sh:#000;color-scheme:dark}
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:400 18px/1.4 "DM Sans",system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
main{width:100%;max-width:900px;padding:24px;text-align:center}
.tag{font:500 14px "DM Mono",monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--red)}
h1{font:800 clamp(52px,12vw,120px)/.92 "Bricolage Grotesque","Arial Black",sans-serif;letter-spacing:-.04em;margin:10px 0 12px}
h1 span{background:var(--red);color:#FBF6EA;padding:0 14px;border-radius:10px;display:inline-block;transform:rotate(-2deg)}
.sub{font-size:clamp(18px,2.4vw,24px);margin:0 0 36px;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
a.b{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 20px;background:var(--gold);color:#1D1B16;text-decoration:none;border:4px solid var(--ink);border-radius:18px;box-shadow:7px 7px 0 var(--sh);transition:transform .12s,box-shadow .12s}
a.b.p{background:var(--panel);color:var(--ink)}
a.b:hover,a.b:focus-visible{transform:translate(-3px,-3px);box-shadow:10px 10px 0 var(--sh);outline:none}
a.b:active{transform:translate(5px,5px);box-shadow:2px 2px 0 var(--sh)}
a.b svg{width:84px;height:84px}
a.b b{font:800 30px "Bricolage Grotesque",sans-serif}a.b small{font-size:16px;opacity:.85}
.foot{margin-top:40px;font:500 14px "DM Mono",monospace;opacity:.7}
</style></head><body><main>
<div class="tag">API styles</div>
<h1><span>SOAP</span> vs REST</h1>
<p class="sub">Learn it, then race it.</p>

</div>
<div class="foot">Ahmed Ridha LAZHARI · 3IA5</div>
</main></body></html>
